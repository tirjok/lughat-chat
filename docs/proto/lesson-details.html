function renderCompetencies() {
  const list = document.getElementById('competencyList');
  list.innerHTML = lessonData.competencies.map((c, i) => `
    <li class="flex items-start gap-3">
      <button onclick="toggleGoal(${i})" class="mt-0.5 flex-shrink-0 w-5 h-5 rounded border-2 ${checkedGoals.has(i) ? 'bg-primary-600 border-primary-600' : 'border-stone-300 hover:border-primary-400'} transition flex items-center justify-center">
        ${checkedGoals.has(i) ? '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
      </button>
      <span class="text-sm text-stone-700 ${checkedGoals.has(i) ? 'line-through text-stone-400' : ''}">${c}</span>
    </li>
  `).join('');
  document.getElementById('completedGoals').textContent = checkedGoals.size;
}

function toggleGoal(i) {
  if (checkedGoals.has(i)) checkedGoals.delete(i);
  else checkedGoals.add(i);
  renderCompetencies();
}

// ============ NAVIGATION ============

function switchSection(section) {
  currentSection = section;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.remove('tab-active');
    btn.classList.add('text-stone-600');
  });
  document.querySelector(`[data-section="${section}"]`).classList.add('tab-active');
  document.querySelector(`[data-section="${section}"]`).classList.remove('text-stone-600');
  renderMainContent();
}

function switchScene(index) {
  currentSceneIndex = index;
  currentLineIndex = -1;
  stopPlayback();
  renderMainContent();
}

function renderMainContent() {
  const main = document.getElementById('mainContent');
  switch(currentSection) {
    case 'dialogue': main.innerHTML = renderDialogue(); break;
    case 'vocabulary': main.innerHTML = renderVocabulary(); break;
    case 'pronouns': main.innerHTML = renderPronouns(); break;
    case 'expressions': main.innerHTML = renderExpressions(); break;
    case 'grammar': main.innerHTML = renderGrammar(); break;
    case 'activities': main.innerHTML = renderActivities(); break;
  }
}

// ============ AUDIO PLAYBACK (SIMULATED) ============

function showAudioBar() {
  document.getElementById('audioBar').classList.remove('translate-y-full');
}

function hideAudioBar() {
  document.getElementById('audioBar').classList.add('translate-y-full');
  stopPlayback();
}

function playLine(index) {
  if (currentSection !== 'dialogue') return;
  currentLineIndex = index;
  playSceneMode = false;
  startPlayback();
  renderMainContent();
  showAudioBar();
  updateAudioBar();
  updateProgress();
}

function playScene() {
  playSceneMode = true;
  currentLineIndex = 0;
  startPlayback();
  renderMainContent();
  showAudioBar();
  updateAudioBar();
  updateProgress();
}

function startPlayback() {
  isPlaying = true;
  audioProgressValue = 0;
  document.getElementById('playIcon').classList.add('hidden');
  document.getElementById('pauseIcon').classList.remove('hidden');
  document.getElementById('waveAnim').classList.remove('hidden');
  
  clearInterval(audioTimer);
  const duration = 4000 / playbackSpeed; // Simulated 4 second audio
  const interval = 50;
  const increment = (interval / duration) * 100;
  
  audioTimer = setInterval(() => {
    audioProgressValue += increment;
    document.getElementById('audioProgress').style.width = audioProgressValue + '%';
    
    const elapsed = (audioProgressValue / 100) * (duration / 1000);
    const total = duration / 1000;
    document.getElementById('audioTime').textContent = `${formatTime(elapsed)} / ${formatTime(total)}`;
    
    if (audioProgressValue >= 100) {
      clearInterval(audioTimer);
      if (playSceneMode) {
        const scene = lessonData.sections.dialogue.scenes[currentSceneIndex];
        if (currentLineIndex < scene.lines.length - 1) {
          setTimeout(() => {
            currentLineIndex++;
            audioProgressValue = 0;
            renderMainContent();
            updateAudioBar();
            startPlayback();
          }, 800);
        } else {
          stopPlayback();
          playSceneMode = false;
        }
      } else {
        stopPlayback();
      }
    }
  }, interval);
}

function stopPlayback() {
  isPlaying = false;
  clearInterval(audioTimer);
  document.getElementById('playIcon').classList.remove('hidden');
  document.getElementById('pauseIcon').classList.add('hidden');
  document.getElementById('waveAnim').classList.add('hidden');
}

function togglePlayPause() {
  if (isPlaying) {
    stopPlayback();
    renderMainContent();
  } else if (currentLineIndex >= 0) {
    startPlayback();
    renderMainContent();
  }
}

function prevLine() {
  if (currentLineIndex > 0) {
    currentLineIndex--;
    audioProgressValue = 0;
    renderMainContent();
    updateAudioBar();
    if (isPlaying) startPlayback();
  }
}

function nextLine() {
  const scene = lessonData.sections.dialogue.scenes[currentSceneIndex];
  if (currentLineIndex < scene.lines.length - 1) {
    currentLineIndex++;
    audioProgressValue = 0;
    renderMainContent();
    updateAudioBar();
    if (isPlaying) startPlayback();
  }
}

function updateAudioBar() {
  const scene = lessonData.sections.dialogue.scenes[currentSceneIndex];
  if (currentLineIndex >= 0 && currentLineIndex < scene.lines.length) {
    document.getElementById('currentLineText').textContent = scene.lines[currentLineIndex].arabic;
  }
}

function updateProgress() {
  const scene = lessonData.sections.dialogue.scenes[currentSceneIndex];
  const totalLines = lessonData.sections.dialogue.scenes.reduce((sum, s) => sum + s.lines.length, 0);
  let completedLines = 0;
  for (let i = 0; i < currentSceneIndex; i++) {
    completedLines += lessonData.sections.dialogue.scenes[i].lines.length;
  }
  completedLines += currentLineIndex + 1;
  const progress = (completedLines / totalLines) * 100;
  document.getElementById('progressBar').style.width = progress + '%';
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

  // Simulated - show a toast or flash
  const expr = lessonData.sections.expressions.expressions[index];
  // Could trigger actual audio in real implementation
}

  });
});

document.getElementById('repeatBtn').addEventListener('click', () => {
  if (currentLineIndex >= 0) {
    audioProgressValue = 0;
    startPlayback();
  }
});
