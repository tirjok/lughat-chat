server {
    listen 80;
    server_name _;

    # CORS headers for all responses (T4.1)
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;

    # Handle CORS preflight requests
    location /api/ {
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # TTS API proxy (FR-02) - routes /api/* to backend
        proxy_pass http://lughat-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large audio file support
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;  # For long-running TTS synthesis
    }

    # TTS API proxy - routes /tts to backend (matches frontend apiBaseUrl)
    location /tts {
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        proxy_pass http://lughat-backend:8000;
    }

    # Health check proxy - routes /health to backend
    location /health {
        proxy_pass http://lughat-backend:8000;
    }

    # Frontend reverse proxy (T4.1) - routes all non-API traffic to frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint for Docker (T4.5)
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
